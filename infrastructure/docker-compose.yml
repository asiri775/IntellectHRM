# Local development dependencies: PostgreSQL + Redis (+ Mailpit to see emails).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ihrm
      POSTGRES_PASSWORD: ihrm
      POSTGRES_DB: ihrm
    ports: ['5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
    ports: ['6379:6379']
  mailpit:
    # Set MAIL_PROVIDER=smtp, SMTP_HOST=localhost, SMTP_PORT=1025 and open http://localhost:8025
    image: axllent/mailpit
    ports: ['1025:1025', '8025:8025']
volumes:
  pgdata:
