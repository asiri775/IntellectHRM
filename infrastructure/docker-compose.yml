# Local development dependencies: PostgreSQL + Redis (+ Mailpit to see emails).
# For local development only: Postgres accepts connections without a password and
# is bound to 127.0.0.1 so it is not reachable from other machines.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ihrm
      POSTGRES_DB: ihrm
      POSTGRES_HOST_AUTH_METHOD: trust
    ports: ['127.0.0.1:5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
    ports: ['127.0.0.1:6379:6379']
  mailpit:
    # Set MAIL_PROVIDER=smtp, SMTP_HOST=localhost, SMTP_PORT=1025 and open http://localhost:8025
    image: axllent/mailpit
    ports: ['127.0.0.1:1025:1025', '127.0.0.1:8025:8025']
volumes:
  pgdata:
